<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CVGSV7Y2CE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-CVGSV7Y2CE');
    </script>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematics Journal Manager - Sachchidanand Prasad</title>

    <meta name="description"
        content="Sachchidanand Prasad's homepage. Postdoctoral Fellow at Jilin University and Göttingen University. Explore research, teaching, CV, articles, daily problems, and more.">
    <meta name="keywords"
        content="Sachchidanand Prasad, postdoctoral fellow, Jilin University, Göttingen University, research, teaching, CV, articles, differential geometry, symplectic geometry, daily problems, gate, research papers, cut locus, quandles, independence complex">

    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.png" />

    <link rel="stylesheet" href="/assets/style.css">

    <script type="module" src="journal-manager.js"></script>

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xxC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- academic icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <!-- Shared header and footer (edit assets/js/site-layout.js) -->
    <script src="../../assets/js/site-layout.js"></script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col h-screen">

        <!-- navbar -->
        <site-header></site-header>

        <!-- section -->
        <section class="text-gray-600 body-font">
            
            <!-- Login Container -->
            <div id="loginContainer" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-lg shadow-md text-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Mathematics Journal Manager</h2>
                <p class="text-gray-600 mb-6">Sign in to access your journal collection</p>
                <div id="message" class="text-red-500 mb-4 hidden"></div>
                <form id="loginForm" class="space-y-4">
                    <input type="email" id="loginEmail" placeholder="Enter email"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                    <input type="password" id="loginPassword" placeholder="Enter password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button type="submit" id="loginBtn"
                        class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600">Log in</button>
                </form>
                <a href="/miscellaneous/" class="block w-full bg-red-500 text-white py-2 rounded-md hover:bg-red-600 text-center my-4">
                    Go Back
                </a>
            </div>
            
            <!-- Main Application Container -->
            <div id="mainApp" class="container mx-auto px-4 py-24 max-w-6xl hidden">
                <!-- Header with logout -->
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">Mathematics Journal Manager</h1>
                    <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                        Logout
                    </button>
                </div>
            
                <div id="message" class="mb-4 hidden"></div>
            
                <!-- Add/Edit Form -->
                <div id="addForm" class="bg-white rounded-lg shadow-md p-6 mb-8">
                    <h2 class="text-xl font-semibold mb-4">Add New Journal</h2>
            
                    <!-- Quick Parse Section -->
                    <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                        <h3 class="font-semibold mb-2">Quick Add from MathSciNet Data</h3>
                        <textarea id="copiedData"
                            placeholder='Paste copied data here (e.g., "Annals of Mathematics", "6.39", "6 issues/vol./yr.", ...)'
                            class="w-full p-3 border border-gray-300 rounded-lg mb-3 h-20 resize-none"></textarea>
                        <button id="parseBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Parse
                            Data</button>
                    </div>
            
                    <form id="journalForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Journal Name *</label>
                            <input type="text" id="journalName" required
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">MCQ</label>
                            <input type="text" id="MCQ"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Publication
                                Frequency</label>
                            <input type="text" id="frequency"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Subjects
                                (comma-separated)</label>
                            <input type="text" id="subjects" placeholder="Algebraic geometry, Number theory, ..."
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">MathSciNet URL *</label>
                            <input type="url" id="mathSciNetUrl" required
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Journal Website URL</label>
                            <input type="url" id="journalUrl"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
            
                        <div class="md:col-span-2 flex space-x-4">
                            <button type="button" id="saveBtn"
                                class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 font-medium">Add
                                Journal</button>
                            <button type="button" id="cancelBtn" onclick="cancelEdit()"
                                class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 font-medium"
                                style="display: none;">Cancel</button>
                        </div>
                    </form>
                </div>
            
                <!-- Journals List -->
                <div>
                    <h2 class="text-2xl font-semibold mb-6">Your Journals</h2>
                    <!-- Search and Controls Bar (add before journalsContainer) -->
                    <div class="bg-white p-4 rounded-lg shadow-md mb-6">
                        <div class="flex flex-col md:flex-row gap-4 items-center">
                            <!-- Search -->
                            <div class="flex-1 relative">
                                <input type="text" id="searchInput" placeholder="Search journals..."
                                    class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                                <button onclick="clearSearch()" class="absolute right-2 top-2 text-gray-400 hover:text-gray-600">✕</button>
                            </div>
                    
                            <!-- Sort -->
                            <select id="sortSelect" class="p-2 border border-gray-300 rounded">
                                <option value="name-asc">Name (A-Z)</option>
                                <option value="name-desc">Name (Z-A)</option>
                                <option value="MCQ-desc">MCQ (High-Low)</option>
                                <option value="MCQ-asc">MCQ (Low-High)</option>
                                <option value="frequency-asc">Frequency (A-Z)</option>
                            </select>
                    
                            <!-- Page Size -->
                            <select id="pageSize" class="p-2 border border-gray-300 rounded">
                                <!-- <option value="4">4 per page</option> -->
                                <option value="6">6 per page</option>
                                <option value="12">12 per page</option>
                                <option value="24">24 per page</option>
                                <option value="48">48 per page</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="journalsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Journals will be loaded here -->
                    </div>
                    <!-- Pagination Container (add after journalsContainer) -->
                    <div id="paginationContainer"></div>
                </div>

                
            
                <!-- Editors Modal -->
                <div id="editorsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
                    <div class="flex items-center justify-center min-h-screen p-4">
                        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-96 overflow-y-auto">
                            <div class="p-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 id="modalTitle" class="text-xl font-semibold text-gray-800">Manage Editors
                                    </h3>
                                    <button onclick="closeEditorsModal()" class="text-gray-400 hover:text-gray-600">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                    </button>
                                </div>
            
                                <div id="editorsContainer" class="mb-4">
                                    <!-- Editor rows will be added here -->
                                </div>
            
                                <div class="flex justify-between items-center">
                                    <button onclick="addEditorRow()"
                                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                                        Add Editor
                                    </button>
                                    <div class="space-x-3">
                                        <button onclick="closeEditorsModal()"
                                            class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                                            Cancel
                                        </button>
                                        <button onclick="saveEditors()"
                                            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                            Save Editors
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- footer -->
        <site-footer></site-footer>

    </div>

    <script>
        function myFunction() {
            var x = document.lastModified;
            document.getElementById("updated").innerHTML = new Date(document.lastModified).toISOString().substr(0, 10);
        }
        myFunction()
    </script>

</body>
</html>
