<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CVGSV7Y2CE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-CVGSV7Y2CE');
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications - Sachchidanand Prasad</title>
  <link rel="canonical" href="https://prasadsachchidanand.github.io/publications/" />
  <meta name="description"
    content="Papers, preprints, PhD thesis and notes of Sachchidanand Prasad (IIIT Delhi) in geometry, topology and algebra, with abstracts, BibTeX and arXiv links.">
  <meta name="keywords"
    content="Sachchidanand Prasad, Assistant Professor, IIIT Delhi, mathematics, publications, preprints, PhD thesis, cut locus, differential geometry">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="../assets/pub-list.css">

  <style>
    /* Publications page. The list styles shared with the Research page are in assets/pub-list.css. */
    .pb [hidden] { display: none !important; }
    .pb-lead { font-size: 1.1rem; line-height: 1.75; text-align: center; max-width: 760px; margin: .5rem auto 0; }
    .pb-search { position: relative; max-width: 640px; margin: 2rem auto .6rem; }
    .pb-search i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--rs-muted); pointer-events: none; }
    .pb-search input { width: 100%; padding: .75rem 1rem .75rem 2.75rem; border-radius: .7rem; border: 1px solid var(--rs-line); background: var(--rs-card); color: var(--rs-ink); font: inherit; font-size: 1rem; }
    .pb-search input::placeholder { color: var(--rs-muted); }
    .pb-search input:focus { outline: 2px solid #6366f1; outline-offset: 1px; }
    #pb-showing { text-align: center; }
    #pb-empty { margin-top: 1.5rem; }
    .pb-list { display: grid; gap: 1rem; }
    .pb-entry { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 0 1.4rem; padding: 1.25rem 1.4rem; scroll-margin-top: 5rem; }
    .pb-cover-box { padding-top: .2rem; }
    .pb-cover { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: contain; border-radius: .3rem; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.18); }
    .pb-blank { display: grid; place-items: center; color: var(--rs-muted); font-size: 1.5rem; background: var(--rs-def); }
    html.dark .pb-cover { background: #f8fafc; box-shadow: none; }   /* logos with transparent backgrounds stay readable */
    html.dark .pb-blank { background: var(--rs-def); }
    .rs-badge.pb-thesis { background: var(--rs-accent-soft); color: var(--rs-accent); }
    @media (max-width: 560px) {
      .pb-entry { grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0 1rem; padding: 1.1rem; }
      .pb-lead { text-align: left; font-size: 1rem; }
    }
  </style>

  <!-- MathJax: configure before loading -->
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Shared header and footer (edit assets/js/site-layout.js) -->
  <script src="../assets/js/site-layout.js"></script>
</head>

<body style="background: #edf2f7;">
  <div class="flex flex-col h-screen">
    <site-header></site-header>

    <main class="rs pb text-gray-600 body-font">
      <div class="container px-5 py-24 mx-auto">
        <div class="rs-wrap">

          <div class="flex flex-col items-center text-center justify-center">
            <h1 class="text-gray-900 text-3xl title-font font-medium">Publications</h1>
            <div class="w-24 h-1 bg-indigo-500 rounded mt-2 mb-4" aria-hidden="true"></div>
          </div>
          <p class="pb-lead">
            Papers and preprints, my PhD thesis and a few expository notes, with abstracts, BibTeX and links.
            The <a class="rs-link" href="../research/#publications">Research page</a> groups the papers by theme.
          </p>

          <!-- The list is built from data/publications.json and data/thesis-and-notes.json (see publications.js) -->
          <div class="pb-search" id="pb-search" role="search">
            <label for="pb-q" class="sr-only">Search the publications</label>
            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
            <input id="pb-q" type="search" placeholder="Search by title, coauthor, journal or year" autocomplete="off" spellcheck="false">
          </div>
          <p class="rs-showing" id="pb-showing" aria-live="polite"></p>
          <div class="rs-card rs-empty" id="pb-empty" hidden></div>
          <noscript>
            <div class="rs-card rs-empty">This list needs JavaScript. My papers are also listed on
              <a class="rs-link" href="https://arxiv.org/a/prasad_s_4.html">arXiv</a> and
              <a class="rs-link" href="https://scholar.google.com/citations?user=i_GAF6kAAAAJ&amp;hl=en">Google Scholar</a>.</div>
          </noscript>

          <div id="pb-lists">
            <section class="rs-section" id="preprints" aria-labelledby="preprints-h" hidden>
              <h2 class="rs-h2" id="preprints-h">Preprints</h2>
              <div class="pb-list" id="preprints-list"></div>
            </section>

            <section class="rs-section" id="published" aria-labelledby="published-h" hidden>
              <h2 class="rs-h2" id="published-h">Published papers</h2>
              <div class="pb-list" id="published-list"></div>
            </section>

            <section class="rs-section" id="thesis" aria-labelledby="thesis-h" hidden>
              <h2 class="rs-h2" id="thesis-h">PhD thesis</h2>
              <div class="pb-list" id="thesis-list"></div>
            </section>

            <section class="rs-section" id="notes" aria-labelledby="notes-h" hidden>
              <h2 class="rs-h2" id="notes-h">Notes</h2>
              <div class="pb-list" id="notes-list"></div>
            </section>
          </div>

        </div>
      </div>
    </main>

    <site-footer></site-footer>
  </div>

  <script src="../assets/js/publications-common.js"></script>
  <script src="publications.js"></script>
</body>
</html>
