                <div class="login-container w-full p-8 rounded-2xl shadow-xl bg-white transform transition-all hover:shadow-2xl">

                    <h1 class="text-4xl font-extrabold text-gray-800 bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Publications Admin</h1>
                    <p class="text-gray-500 mt-3 text-lg">Sign in to manage your research publications</p>
                    </div>
                    
                    <div id="loginMessage" class="hidden mb-6 p-4 rounded-lg transition-all duration-300"></div>
                    
                    <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-500 transition-all duration-200 bg-gray-50 hover:bg-white">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" required 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-500 transition-all duration-200 bg-gray-50 hover:bg-white">
                    </div>
                    
                    <button type="submit" 
                            class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-all duration-200 transform hover:-translate-y-0.5 hover:shadow-lg">
                        Sign In
                    </button>
                    </form>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
            import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";
            
            const firebaseConfig = {
              apiKey: "AIzaSyACGMnModEH-dUeFRzA_rnnAL-zoccdw90",
              authDomain: "add-publication.firebaseapp.com",
              projectId: "add-publication",
              storageBucket: "add-publication.appspot.com",
              messagingSenderId: "449539950324",
              appId: "1:449539950324:web:74e4f3584e68502a2d00a1"
            };
            
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');
            
            loginForm.addEventListener('submit', async (e) => {
              e.preventDefault();
              
              const email = document.getElementById('email').value;
              const password = document.getElementById('password').value;
              
              try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "admin.html";
              } catch (error) {
                showMessage(error.message, "red");
              }
            });
            
            function showMessage(text, color = "blue") {
              const colors = {
                blue: "bg-blue-100 text-blue-800",
                red: "bg-red-100 text-red-800"
              };
              
              loginMessage.className = `${colors[color]} p-3 rounded`;
              loginMessage.textContent = text;
              loginMessage.classList.remove("hidden");
            }
        </script>
